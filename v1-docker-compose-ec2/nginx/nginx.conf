worker_processes auto;
events { worker_connections 1024; }

http {
  server {
    listen 80;

    # nginx has exactly two upstreams: frontend1 and frontend2.
    # "backend" does not appear anywhere in this file -- API calls are
    # forwarded by whichever frontend container served the page, not
    # by this proxy. See apps/frontend-insert/nginx.conf.
    location = /app1 { return 302 /app1/; }
    location = /app2 { return 302 /app2/; }

    # --- App 1: insert-only frontend --------------------------------
    # Trailing slash on both `location` and `proxy_pass` means nginx
    # strips the /app1/ prefix before forwarding, e.g.
    #   browser  -> GET /app1/assets/index-abc.js
    #   nginx    -> GET http://frontend1:3000/assets/index-abc.js
    # and, since App 1's own fetch calls are relative too:
    #   browser  -> POST /app1/api/items
    #   nginx    -> POST http://frontend1:3000/api/items
    # which frontend1's own nginx then proxies onward to backend:8000.
    location /app1/ {
      proxy_pass http://frontend1:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- App 2: list-only frontend -----------------------------------
    location /app2/ {
      proxy_pass http://frontend2:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      default_type text/plain;
      return 200 "Pathgate demo.\nVisit /app1 to insert data or /app2 to list data.\n";
    }
  }
}
