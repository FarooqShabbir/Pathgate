# Used only by Dockerfile.eks (v3's EKS variant). The AWS Load
# Balancer Controller's ALB, like any ALB, forwards the matched path
# UNCHANGED -- it does not strip /app1/ the way v1's top-level nginx
# does. So this container has to know its own /app1/ prefix, AND
# proxy its own /app1/api/ calls to backend locally -- that's what
# keeps the nginx/Ingress -> frontend -> backend -> db tier chain
# intact instead of Ingress routing straight to backend. K8s' own
# DNS resolves "backend" to the backend Service within this
# namespace, same idea as Docker Compose's embedded DNS in v1.
server {
  listen 3000;

  location /app1/api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /app1/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /app1/index.html;
  }

  location = /app1 {
    return 302 /app1/;
  }

  # The ALB target group's health check hits "/" by default.
  location = / {
    return 200 "frontend-insert ok\n";
    default_type text/plain;
  }
}
