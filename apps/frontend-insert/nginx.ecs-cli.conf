# Used only by Dockerfile.ecs-cli (v2's ECS Fargate variant, deployed
# via `ecs-cli compose service up`). Identical to nginx.conf except
# the backend upstream is a Cloud Map private-DNS name instead of the
# Docker Compose service name "backend" -- there's no shared bridge
# network here, so plain "backend:8000" wouldn't resolve.
server {
  listen 3000;

  location /api/ {
    proxy_pass http://backend.pathgate.local:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
