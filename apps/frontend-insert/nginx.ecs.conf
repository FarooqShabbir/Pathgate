# Used only by Dockerfile.ecs (ECS Fargate / Elastic Beanstalk-behind-ALB
# variants). Unlike v1's nginx reverse proxy, an ALB does NOT strip the
# /app1 prefix before forwarding -- it forwards the original path as-is.
# So this container has to understand its own /app1/ prefix itself.
server {
  listen 80;

  location /app1/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /app1/index.html;
  }

  location = /app1 {
    return 302 /app1/;
  }

  location = / {
    return 200 "frontend-insert ok\n";
    default_type text/plain;
  }
}
