# This container's own web server -- not just a static file host. It
# does two jobs: serve the built React app, and proxy this app's own
# /api/ calls to the backend. That second job is what makes the
# nginx -> frontend -> backend -> db chain literal instead of a
# shortcut: the top-level reverse proxy (or ALB/EB load balancer)
# only ever talks to this container; this container is the only thing
# that talks to `backend`.
server {
  listen 3000;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
