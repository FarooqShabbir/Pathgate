server {
  listen 3000;

  # Without this, the `return 302 /app2/;` below builds an ABSOLUTE
  # redirect using nginx's own listening port (:3000) -- meaningless
  # from outside the cluster, since the ALB terminates on :80 and
  # translates to :3000 internally. `absolute_redirect off` makes
  # nginx emit a bare relative Location header instead, immune to
  # whatever's actually in front of this container.
  absolute_redirect off;

  location /app2/api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /app2/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /app2/index.html;
  }

  location = /app2 {
    return 302 /app2/;
  }

  location = / {
    return 200 "frontend-list ok\n";
    default_type text/plain;
  }
}
