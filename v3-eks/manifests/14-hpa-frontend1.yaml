apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend1-hpa
  namespace: pathgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend1
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
