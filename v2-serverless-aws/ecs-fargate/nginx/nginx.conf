# Same routing as v1's nginx.conf. The only difference: upstreams are
# Cloud Map private-DNS names (<service>.pathgate.local) instead of
# Docker Compose service names, because there's no Docker embedded DNS
# on ECS -- Cloud Map is what 01-setup-foundation.sh registers each
# service under, and what create-service's --service-registries flag
# keeps in sync with each task's actual IP as tasks come and go.
worker_processes auto;
events { worker_connections 1024; }

http {
  server {
    listen 80;

    location = /app1 { return 302 /app1/; }
    location = /app2 { return 302 /app2/; }

    location /app1/ {
      proxy_pass http://frontend1.pathgate.local:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /app2/ {
      proxy_pass http://frontend2.pathgate.local:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      default_type text/plain;
      return 200 "Pathgate demo (ECS Fargate, no load balancer).\nVisit /app1 to insert data or /app2 to list data.\n";
    }
  }
}
