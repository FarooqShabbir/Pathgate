# Deployed by `eb create`/`eb deploy` (EB CLI), not Terraform. Elastic
# Beanstalk's Docker platform runs `docker compose up` on the one EC2
# instance it manages for you -- and unlike the ECS Fargate variant,
# db stays a plain container + volume here too, exactly like v1, since
# EB gives you one real host to put it on. No RDS, no ECR Terraform
# resources: just this file plus four pushed images (build_push.sh)
# and the env vars build_push.sh renders into
# .ebextensions/01-environment.config.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pathgate
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      STORAGE_BACKEND: postgres
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: pathgate
      POSTGRES_USER: pathgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db

  frontend1:
    image: ${FRONTEND_INSERT_IMAGE}
    depends_on:
      - backend

  frontend2:
    image: ${FRONTEND_LIST_IMAGE}
    depends_on:
      - backend

  nginx:
    image: ${NGINX_IMAGE}
    ports:
      - "80:80"
    depends_on:
      - frontend1
      - frontend2

volumes:
  db_data:
